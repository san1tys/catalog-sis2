// Контракт внутреннего канала Catalog API (gRPC).
//
// Публичный край остаётся REST/JSON (см. SIS #1), а этот контракт описывает
// service-to-service вызовы: BFF / admin-tools -> Catalog API.
//
// Метаданные запроса (gRPC metadata), аналог HTTP-заголовков:
//   idempotency-key  — обязателен для CreateProduct (аналог Idempotency-Key)
//   x-actor-id       — кто выполняет запись (пара actor+key уникальна)
//   x-request-id     — сквозной идентификатор запроса (необязателен)
// Метаданные ответа (trailers) при ошибке:
//   x-error-code     — стабильный код ошибки домена (VERSION_CONFLICT, ...)
//   x-request-id     — идентификатор запроса
//
// Deadline передаётся штатным механизмом gRPC (grpc-timeout) и действует на
// весь вложенный вызов: хранилище и кэш получают остаток бюджета.
syntax = "proto3";

package catalog.v1;

option go_package = "github.com/adilbek/catalog-sis2/gen/catalog/v1;catalogv1";

service CatalogService {
  // Чтение карточки. Скрытые товары: NOT_FOUND.
  rpc GetProduct(GetProductRequest) returns (Product);
  // Чтение карточки администратором: видны скрытые.
  rpc GetProductAdmin(GetProductRequest) returns (Product);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  // Идемпотентное создание (ключ в metadata).
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  // Оптимистичная блокировка: expected_version == If-Match.
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
  // Идемпотентное по смыслу снятие с публикации.
  rpc HideProduct(HideProductRequest) returns (HideProductResponse);
}

message Product {
  int64 id = 1;
  int64 category_id = 2;
  string title = 3;
  int64 brand_id = 4;
  string description = 5;
  int64 price_minor = 6;  // минимальные денежные единицы (тиын)
  string currency = 7;
  bool in_stock = 8;
  map<string, string> attributes = 9;
  string status = 10;  // active | hidden
  int64 version = 11;
  int64 updated_at_unix_ms = 12;
  repeated string image_keys = 13;
}

// Компактная проекция для выдачи поиска (без описания и атрибутов).
message ProductSummary {
  int64 id = 1;
  int64 category_id = 2;
  int64 brand_id = 3;
  string title = 4;
  int64 price_minor = 5;
  string currency = 6;
  bool in_stock = 7;
  int64 version = 8;
  string thumb_key = 9;
}

message Category {
  int64 id = 1;
  int64 parent_id = 2;  // 0 = корень
  string slug = 3;
  string name = 4;
}

message GetProductRequest {
  int64 id = 1;
}

message ListCategoriesRequest {}

message ListCategoriesResponse {
  repeated Category categories = 1;
  string etag = 2;
}

message SearchRequest {
  string q = 1;
  int64 category_id = 2;
  int64 brand_id = 3;
  optional int64 price_min_minor = 4;
  optional int64 price_max_minor = 5;
  string sort = 6;   // relevance | price_asc | price_desc | newest
  int32 limit = 7;   // по умолчанию 24, максимум 48
  string cursor = 8; // непрозрачный подписанный курсор
}

message SearchResponse {
  repeated ProductSummary items = 1;
  string next_cursor = 2;
}

message ProductInput {
  int64 category_id = 1;
  string title = 2;
  int64 brand_id = 3;
  string description = 4;
  int64 price_minor = 5;
  string currency = 6;
  bool in_stock = 7;
  map<string, string> attributes = 8;
  repeated string image_keys = 9;
}

message CreateProductRequest {
  ProductInput input = 1;
}

message CreateProductResponse {
  Product product = 1;
  // true, если вернулся результат прошлого запроса с тем же ключом.
  bool replayed = 2;
}

message Attributes {
  map<string, string> values = 1;
}

message UpdateProductRequest {
  int64 id = 1;
  int64 expected_version = 2;
  optional int64 category_id = 3;
  optional string title = 4;
  optional int64 brand_id = 5;
  optional string description = 6;
  optional int64 price_minor = 7;
  optional string currency = 8;
  optional bool in_stock = 9;
  // Если задано, полностью заменяет атрибуты.
  Attributes attributes = 10;
}

message HideProductRequest {
  int64 id = 1;
  int64 expected_version = 2;
}

message HideProductResponse {
  int64 version = 1;
}
